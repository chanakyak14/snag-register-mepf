<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEPF Snag List</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f6f8;
            color: #1f2933;
        }

        header {
            background: #0b1f3a;
            color: white;
            padding: 18px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header p {
            margin: 5px 0 0;
            color: #b9dfe0;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 15px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .top-bar h2 {
            margin: 0;
            color: #0b1f3a;
            font-size: 20px;
        }

        .btn {
            background: #008c95;
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        .btn:hover {
            background: #006f76;
        }

        .filter-bar {
            background: white;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-bar select {
            padding: 9px 10px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            background: white;
            color: #1f2933;
            font-size: 13px;
            min-width: 160px;
        }

        .filter-bar select:focus {
            outline: none;
            border-color: #008c95;
        }

        .status-message {
            background: white;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
        }

        .table-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 950px;
        }

        th {
            background: #0b1f3a;
            color: white;
            padding: 12px 10px;
            text-align: left;
            font-size: 13px;
            white-space: nowrap;
        }

        td {
            padding: 11px 10px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
            vertical-align: top;
        }

        tr:hover {
            background: #f5fafb;
        }

        .status-open {
            color: #b45309;
            font-weight: bold;
        }

        .no-data {
            text-align: center;
            padding: 30px;
            color: #6b7280;
        }

        .photo-link {
            color: #008c95;
            text-decoration: none;
            font-weight: bold;
        }

        footer {
            text-align: center;
            color: #777;
            font-size: 11px;
            padding: 25px 10px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 20px;
            }

            .container {
                margin-top: 15px;
            }

            .top-bar h2 {
                font-size: 18px;
            }

            .filter-bar select {
                width: 100%;
                min-width: 0;
            }

            .filter-bar .btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>MEPF Snag Register</h1>
    <p>Snag Identification & Tracking</p>
</header>

<div class="container">

    <div class="top-bar">
        <h2>Live Snag List</h2>

        <a href="index.html" class="btn">
            + Raise New Snag
        </a>
    </div>

    <div id="statusMessage" class="status-message"></div>

    <div class="filter-bar">

        <select id="packageFilter">
            <option value="">All Packages</option>
        </select>

        <select id="vendorFilter">
            <option value="">All Vendors</option>
        </select>

        <select id="shopFilter">
            <option value="">All Shops / Buildings</option>
        </select>

        <select id="statusFilter">
            <option value="">All Status</option>
        </select>

        <button type="button" class="btn" onclick="clearFilters()">
            Clear Filters
        </button>

    </div>

    <div class="table-card">

        <table>
            <thead>
                <tr>
                    <th>Sr. No.</th>
                    <th>Package</th>
                    <th>Vendor</th>
                    <th>Raised By</th>
                    <th>Raised On</th>
                    <th>Shop / Building</th>
                    <th>Location</th>
                    <th>Snag Description</th>
                    <th>Status</th>
                    <th>Reference Image</th>
                </tr>
            </thead>

            <tbody id="snagTableBody">
                <tr>
                    <td colspan="10" class="no-data">
                        Loading snags...
                    </td>
                </tr>
            </tbody>
        </table>

    </div>

</div>

<footer>
    Developed by Ravi Teja M
</footer>

<script>
    const SUPABASE_URL = "https://mbetkoyethmcdgdprdcg.supabase.co";

    const SUPABASE_KEY = "sb_publishable_K-ro9DWU-qxlFc_V_NqQdg_XLG-kjuv";

    const TABLE_NAME = "Snag Register _ MEPF";

    let allSnags = [];


    async function loadSnags() {

        const tableBody = document.getElementById("snagTableBody");
        const statusMessage = document.getElementById("statusMessage");

        try {

            const response = await fetch(
                `${SUPABASE_URL}/rest/v1/${encodeURIComponent(TABLE_NAME)}?select=*&order=raised_on.desc`,
                {
                    method: "GET",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                }
            );

            if (!response.ok) {
                throw new Error("Unable to load snag records.");
            }

            const snags = await response.json();

            snags.sort((a, b) => {
                return new Date(b.raised_on) - new Date(a.raised_on);
            });

            allSnags = snags;

            populateFilters();

            displaySnags(allSnags);

        } catch (error) {

            console.error(error);

            tableBody.innerHTML = `
                <tr>
                    <td colspan="10" class="no-data">
                        Unable to load snag records.
                    </td>
                </tr>
            `;

            statusMessage.style.display = "block";
            statusMessage.textContent =
                "Unable to connect to the snag database.";
        }
    }


    function populateFilters() {

        const packageFilter =
            document.getElementById("packageFilter");

        const vendorFilter =
            document.getElementById("vendorFilter");

        const shopFilter =
            document.getElementById("shopFilter");

        const statusFilter =
            document.getElementById("statusFilter");


        const packages = [...new Set(
            allSnags
                .map(snag => snag.package)
                .filter(Boolean)
        )].sort();


        const vendors = [...new Set(
            allSnags
                .map(snag => snag.vendor)
                .filter(Boolean)
        )].sort();


        const shops = [...new Set(
            allSnags
                .map(snag => snag.shop_building)
                .filter(Boolean)
        )].sort();


        const statuses = [...new Set(
            allSnags
                .map(snag => snag.status)
                .filter(Boolean)
        )].sort();


        packageFilter.innerHTML =
            `<option value="">All Packages</option>`;

        vendorFilter.innerHTML =
            `<option value="">All Vendors</option>`;

        shopFilter.innerHTML =
            `<option value="">All Shops / Buildings</option>`;

        statusFilter.innerHTML =
            `<option value="">All Status</option>`;


        packages.forEach(item => {

            packageFilter.innerHTML +=
                `<option value="${item}">${item}</option>`;

        });


        vendors.forEach(item => {

            vendorFilter.innerHTML +=
                `<option value="${item}">${item}</option>`;

        });


        shops.forEach(item => {

            shopFilter.innerHTML +=
                `<option value="${item}">${item}</option>`;

        });


        statuses.forEach(item => {

            statusFilter.innerHTML +=
                `<option value="${item}">${item}</option>`;

        });


        packageFilter.onchange = applyFilters;
        vendorFilter.onchange = applyFilters;
        shopFilter.onchange = applyFilters;
        statusFilter.onchange = applyFilters;
    }


    function applyFilters() {

        const packageValue =
            document.getElementById("packageFilter").value;

        const vendorValue =
            document.getElementById("vendorFilter").value;

        const shopValue =
            document.getElementById("shopFilter").value;

        const statusValue =
            document.getElementById("statusFilter").value;


        const filteredSnags = allSnags.filter(snag => {

            const packageMatch =
                !packageValue ||
                snag.package === packageValue;


            const vendorMatch =
                !vendorValue ||
                snag.vendor === vendorValue;


            const shopMatch =
                !shopValue ||
                snag.shop_building === shopValue;


            const statusMatch =
                !statusValue ||
                snag.status === statusValue;


            return packageMatch &&
                   vendorMatch &&
                   shopMatch &&
                   statusMatch;
        });


        displaySnags(filteredSnags);
    }


    function displaySnags(snags) {

        const tableBody =
            document.getElementById("snagTableBody");

        tableBody.innerHTML = "";


        if (snags.length === 0) {

            tableBody.innerHTML = `
                <tr>
                    <td colspan="10" class="no-data">
                        No snags found for selected filters.
                    </td>
                </tr>
            `;

            return;
        }


        snags.forEach(snag => {

            const row =
                document.createElement("tr");


            const raisedOn = snag.raised_on
                ? new Date(snag.raised_on).toLocaleString(
                    "en-IN",
                    {
                        timeZone: "Asia/Kolkata"
                    }
                )
                : "";


            const imageCell = snag.reference_image
                ? `<a class="photo-link" href="${snag.reference_image}" target="_blank">View Photo</a>`
                : "-";


            row.innerHTML = `
                <td>${snag.id}</td>
                <td>${snag.package || ""}</td>
                <td>${snag.vendor || ""}</td>
                <td>${snag.raised_by || ""}</td>
                <td>${raisedOn}</td>
                <td>${snag.shop_building || ""}</td>
                <td>${snag.location || ""}</td>
                <td>${snag.snag_description || ""}</td>
                <td class="status-open">${snag.status || ""}</td>
                <td>${imageCell}</td>
            `;


            tableBody.appendChild(row);
        });
    }


    function clearFilters() {

        document.getElementById("packageFilter").value = "";

        document.getElementById("vendorFilter").value = "";

        document.getElementById("shopFilter").value = "";

        document.getElementById("statusFilter").value = "";

        displaySnags(allSnags);
    }


    loadSnags();

</script>

</body>
</html>
